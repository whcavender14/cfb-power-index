name: CFB Power Index

on:
  push:
    branches: [main, master]
  schedule:
    # Monday 09:00 UTC, August–January. January belongs to the previous season.
    - cron: '0 9 * 8-12,1 1'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Run R ratings and simulations before deployment
        type: boolean
        default: true

concurrency:
  group: cfb-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      REFRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Verify pnpm build-script policy
        run: node scripts/check-pnpm-config.mjs || true

      - run: pnpm install --frozen-lockfile

      - uses: r-lib/actions/setup-r@v2
        if: env.REFRESH == 'true'
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: env.REFRESH == 'true'
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::purrr
            any::tibble
            any::rlang
            any::Matrix
            any::quantreg
            any::jsonlite
            any::data.table
            any::httr2
            any::cfbfastR
            sportsdataverse/cfbseedR@4a1c78e184773c22da43c40a9eb999d23283297f

      - name: Verify frozen inputs
        if: env.REFRESH == 'true'
        env:
          CFB_PROJECT_ROOT: ${{ github.workspace }}
        run: Rscript scripts/verify_frozen_inputs.R

      - name: Build ratings and simulations
        if: env.REFRESH == 'true'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_PROJECT_ROOT: ${{ github.workspace }}
          CFB_REFRESH_SCHEDULE: 'true'
        run: Rscript scripts/run_weekly_pipeline.R

      - name: Export public data
        if: env.REFRESH == 'true'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_PROJECT_ROOT: ${{ github.workspace }}
          CFB_REFRESH_SCHEDULE: 'true'
          CFB_EXPORT_BETTING: 'true'
        run: Rscript scripts/03_export_public_data.R

      - name: Validate public data
        run: pnpm test

      - name: Mirror team logos for PNG export (same-origin, CORS-safe)
        run: pnpm logos

      - name: Build static site
        run: pnpm build

      - name: Commit refreshed public data
        if: env.REFRESH == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh CFB model output"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

      # Deploy in this same run: commits made with GITHUB_TOKEN don't trigger push workflows.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
